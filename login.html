<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบตรวจนับสต็อกสินค้า - หจก.สิรณัฐการค้า</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1, h2, h3, h4, h5, h6, .brand-font {
      font-family: 'Prompt', sans-serif;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .nav-tabs .nav-link {
      border: none;
      color: #64748b;
      font-weight: 600;
      padding: 12px 20px;
    }
    .nav-tabs .nav-link.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
      background: transparent;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="container" style="max-width: 480px;">
    <!-- Logo & Title -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-4 bg-primary text-white shadow-sm p-3 mb-2" style="width: 60px; height: 60px;">
        <i class="bi bi-boxes fs-2"></i>
      </div>
      <h4 class="fw-bold text-slate-900 mb-1 brand-font">Intelligent Stock</h4>
      <div class="text-secondary small">หจก.สิรณัฐการค้า · ระบบรายงานและนับสต็อกสินค้า</div>
    </div>

    <!-- Active Session Auto-Restore Banner -->
    <div id="sessionFoundBanner" class="d-none alert alert-success rounded-3 mb-3 p-3 shadow-sm border-0">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <div class="fw-bold small text-success-emphasis"><i class="bi bi-person-check-fill me-1"></i>พบเซสชันที่เข้าสู่ระบบไว้:</div>
          <div id="sessionUserName" class="small fw-semibold text-dark"></div>
        </div>
        <button id="btnContinueSession" class="btn btn-success btn-sm px-3 rounded-pill fw-bold">เข้าสู่ระบบต่อทันที</button>
      </div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <ul class="nav nav-tabs nav-justified border-bottom" id="authTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane">
            <i class="bi bi-box-arrow-in-right me-1"></i>เข้าสู่ระบบ
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane">
            <i class="bi bi-person-plus me-1"></i>สมัครบัญชีพนักงาน
          </button>
        </li>
      </ul>

      <div class="p-4">
        <!-- Message Alert -->
        <div id="authAlert" class="d-none alert alert-danger py-2 small mb-3"></div>

        <div class="tab-content" id="authTabContent">
          <!-- Login Form -->
          <div class="tab-pane fade show active" id="loginPane">
            <form id="formLogin">
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">ชื่อผู้ใช้งาน (Username)</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                  <input type="text" id="loginUsername" class="form-control" placeholder="เช่น a11, p11" required />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">รหัสผ่าน (Password)</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" id="loginPassword" class="form-control" placeholder="กรอกรหัสผ่าน" required />
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check small">
                  <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked />
                  <label class="form-check-label text-secondary" for="rememberMeCheck">จำการเข้าสู่ระบบไว้ในเครื่องนี้</label>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                เข้าสู่ระบบ
              </button>
            </form>

            <div class="mt-4 pt-3 border-top">
              <div class="small fw-bold text-secondary mb-2">บัญชีสำหรับทดสอบ:</div>
              <div class="d-flex gap-2">
                <button type="button" onclick="quickFill('p11', 'pa12345')" class="btn btn-outline-secondary btn-sm flex-grow-1 text-start">
                  <strong>พนักงาน:</strong> p11 / pa12345
                </button>
                <button type="button" onclick="quickFill('a11', '1234aa')" class="btn btn-outline-secondary btn-sm flex-grow-1 text-start">
                  <strong>ผู้ดูแลระบบ:</strong> a11 / 1234aa
                </button>
              </div>
            </div>
          </div>

          <!-- Register Form -->
          <div class="tab-pane fade" id="registerPane">
            <form id="formRegister">
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">ชื่อผู้ใช้งานใหม่ (Username)</label>
                <input type="text" id="regUsername" class="form-control" placeholder="เช่น somchai99" required />
              </div>
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">รหัสผ่าน (Password)</label>
                <input type="password" id="regPassword" class="form-control" placeholder="ตั้งรหัสผ่านอย่างน้อย 4 ตัวอักษร" required />
              </div>
              <div class="row g-2 mb-3">
                <div class="col-7">
                  <label class="form-label small fw-bold text-secondary">ชื่อ-นามสกุลจริง</label>
                  <input type="text" id="regFullname" class="form-control" placeholder="สมชาย ใจดี" required />
                </div>
                <div class="col-5">
                  <label class="form-label small fw-bold text-secondary">ชื่อเล่น</label>
                  <input type="text" id="regNickname" class="form-control" placeholder="บอย" required />
                </div>
              </div>
              <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 shadow-sm">
                สมัครสมาชิกและเข้าสู่ระบบทันที
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="p-3 bg-light border-top text-center text-muted small">
        <i class="bi bi-shield-check text-success me-1"></i>
        บันทึกข้อมูลถาวร & จดจำเซสชันอัตโนมัติบนเบราว์เซอร์
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const INITIAL_USERS = [
      { id: 1, username: 'a11', password: '1234aa', fullname: 'ผู้ดูแลระบบ', role: 'admin' },
      { id: 2, username: 'p11', password: 'pa12345', fullname: 'พนักงานนับสต็อก', nickname: 'พนักงาน', role: 'staff' }
    ];

    const savedUserRaw = localStorage.getItem('sirinath_user');
    if (savedUserRaw) {
      try {
        const u = JSON.parse(savedUserRaw);
        if (u && u.username) {
          const banner = document.getElementById('sessionFoundBanner');
          const nameSpan = document.getElementById('sessionUserName');
          nameSpan.textContent = `${u.fullname} (${u.role === 'admin' ? 'ผู้ดูแลระบบ' : 'พนักงาน'})`;
          banner.classList.remove('d-none');
          document.getElementById('btnContinueSession').onclick = () => {
            redirectUser(u);
          };
        }
      } catch(e) {}
    }

    function redirectUser(user) {
      if (user.role === 'admin') {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'stock-count.html';
      }
    }

    function quickFill(u, p) {
      document.getElementById('loginUsername').value = u;
      document.getElementById('loginPassword').value = p;
    }

    function showAlert(msg, isSuccess = false) {
      const alertBox = document.getElementById('authAlert');
      alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'} py-2 small mb-3`;
      alertBox.textContent = msg;
      alertBox.classList.remove('d-none');
    }

    document.getElementById('formLogin').addEventListener('submit', (e) => {
      e.preventDefault();
      const uVal = document.getElementById('loginUsername').value.trim();
      const pVal = document.getElementById('loginPassword').value.trim();

      const users = JSON.parse(localStorage.getItem('sirinath_users') || JSON.stringify(INITIAL_USERS));
      const found = users.find(u => u.username.toLowerCase() === uVal.toLowerCase() && u.password === pVal);

      if (!found) {
        showAlert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
        return;
      }

      localStorage.setItem('sirinath_user', JSON.stringify(found));
      showAlert('เข้าสู่ระบบสำเร็จ! กำลังนำเข้าสู่ระบบ...', true);
      setTimeout(() => redirectUser(found), 600);
    });

    document.getElementById('formRegister').addEventListener('submit', (e) => {
      e.preventDefault();
      const uVal = document.getElementById('regUsername').value.trim();
      const pVal = document.getElementById('regPassword').value.trim();
      const fnVal = document.getElementById('regFullname').value.trim();
      const nnVal = document.getElementById('regNickname').value.trim();

      const users = JSON.parse(localStorage.getItem('sirinath_users') || JSON.stringify(INITIAL_USERS));
      if (users.some(u => u.username.toLowerCase() === uVal.toLowerCase())) {
        showAlert(`ชื่อผู้ใช้ "${uVal}" มีผู้ใช้งานแล้ว`);
        return;
      }

      const newUser = {
        id: Date.now(),
        username: uVal,
        password: pVal,
        fullname: fnVal,
        nickname: nnVal,
        role: 'staff'
      };

      users.push(newUser);
      localStorage.setItem('sirinath_users', JSON.stringify(users));
      localStorage.setItem('sirinath_user', JSON.stringify(newUser));

      showAlert('สมัครสมาชิกสำเร็จ! บันทึกเซสชันและเข้าสู่ระบบเรียบร้อย', true);
      setTimeout(() => redirectUser(newUser), 600);
    });
  </script>
</body>
</html>
